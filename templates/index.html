<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodwood Bakeshop - Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="screen-container">
        <div class="nav-bar">
            <a href="index.html" class="brand" style="font-size: 20px;">GOODWOOD BAKESHOP</a>
            <div class="nav-links" style="margin: 0 auto;">
                <a href="homepage.html">Home</a>
                <a href="menu.html" class="active">Menu</a>
                <a href="#">About</a>
                <a href="dashboard.html">Staff</a>
            </div>
            <div class="nav-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Search menu...">
                    <span class="icon-btn">🔍</span>
                </div>
                <a href="checkout.html" class="icon-btn">🛒</a>
            </div>
        </div>
        <div class="menu-layout">
            <div class="sidebar">
                <h3>Categories</h3>
                <ul>

                <div class="product-card">
                    <div class="prod-img">☕</div>

                    <div class="price">$4.50</div>
                    <a href="checkout.html" class="btn-primary" style="padding: 8px 16px; font-size: 13px;">Add to Cart</a>
